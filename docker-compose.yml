version: "3.8"

services:
  api:
    build: .
    container_name: cortex_api
    ports:
      - "8000:8000"
    environment:
      # Google Gemini's API is OpenAI-compatible through its OpenAI endpoint.
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - GEMINI_VISION_MODEL=${GEMINI_VISION_MODEL:-gemini-3.6-flash}
      # We tell our app to connect to the Qdrant container instead of a local folder
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    volumes:
      # Optional: syncs your local code to the container for development
      - .:/app

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cortex_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Persist the vector data on your host machine so it survives restarts
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
