version: '3.8'

services:
  api:
    build: .
    container_name: cortex_api
    ports:
      - "8000:8000"
    environment:
      # Pass the OpenAI key from your host's .env to the container
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-4o-mini
      # We tell our app to connect to the Qdrant container instead of a local folder
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - qdrant
    volumes:
      # Optional: syncs your local code to the container for development
      - .:/app

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cortex_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # Persist the vector data on your host machine so it survives restarts
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data: